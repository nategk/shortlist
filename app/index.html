<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shortlist</title>
<meta name="theme-color" content="#127a5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">Shortlist</span>
    <button class="source-pill" id="source-pill" type="button" aria-label="Data source settings">
      <i class="dot" id="source-dot"></i><span id="source-name">Loading…</span><span class="kind" id="source-kind"></span>
    </button>
  </div>

  <header class="search">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title-wrap"></h1>
    <p class="brief" id="brief"></p>
    <div class="sync-line" id="sync" role="status"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Filter listings"></nav>
  <main class="grid" id="grid"></main>

  <section class="panel" id="criteria-panel" hidden>
    <details class="more" id="criteria-details"><summary>Criteria</summary>
      <textarea id="criteria" class="doc" spellcheck="true" aria-label="Criteria"></textarea>
      <div class="actions"><button class="btn primary" type="button" id="save-criteria" disabled>Save criteria</button><span class="hint" id="criteria-hint"></span></div>
    </details>
    <details class="more"><summary>Features that matter</summary>
      <p class="hint">One per line: <code>Label | points</code>. Cards show the ones a listing has, and their points are added to its fit score. Crawls check new listings for them; tap a chip on a card to correct it.</p>
      <textarea id="features" class="doc short" spellcheck="true" aria-label="Features that matter" placeholder="Gym | +3"></textarea>
      <div class="actions"><button class="btn primary" type="button" id="save-features" disabled>Save features</button><span class="hint" id="features-hint"></span></div>
    </details>
    <details class="more"><summary>Contact template</summary>
      <textarea id="contact" class="doc" spellcheck="true" aria-label="Contact template"></textarea>
      <div class="actions"><button class="btn primary" type="button" id="save-contact" disabled>Save template</button>
        <button class="btn" type="button" id="copy-contact">Copy</button><span class="hint" id="contact-hint"></span></div>
    </details>
  </section>

  <section class="panel" id="sources-panel" hidden>
    <div class="panel-head">
      <h2>Sources</h2>
      <span class="actions"><span class="hint" id="crawl-hint"></span><button class="btn primary" type="button" id="run-crawl" hidden>Run crawl</button></span>
    </div>
    <ul class="rows" id="sources"></ul>
  </section>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Data source</h2>
    <label>Type
      <select id="set-adapter"></select>
    </label>
    <div id="set-fields" style="display:grid;gap:12px"></div>
    <p class="hint" id="set-hint"></p>
    <div class="row">
      <button class="btn" type="button" id="set-clear">Clear offline copy</button>
      <span style="display:flex;gap:8px">
        <button class="btn" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="save" id="set-save">Connect</button>
      </span>
    </div>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
